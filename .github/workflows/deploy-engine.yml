name: Zero-Trust GCP Deployment Engine

# ─────────────────────────────────────────────────────────────────────────────
# Reusable Deployment Engine for Google Cloud Platform (Cloud Run & Compute Engine)
#
# Key Features:
#   - Keyless Authentication via GCP Workload Identity Federation (OIDC)
#   - Automated Trivy Container Vulnerability Scan with SARIF export to GitHub Security
#   - Zero Public Internet Exposure:
#       * Cloud Run: Private-only Serverless VPC Egress Connectors
#       * Compute Engine VMs: Identity-Aware Proxy (IAP) Tunneling
#   - Automated HTTP Health-Check Polling & Fail-Fast Crash Detection
#   - Automated Zero-Downtime Rollback to Previous Docker Image on Failure
#   - Real-Time Slack Alerting with Container Logs on Failure
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      SERVICE_NAME:          { required: true,  type: string }
      ENV_TAG:               { required: true,  type: string }
      COMPOSE_SERVICE:       { type: string,    default: "" }
      AR_REPO:               { required: true,  type: string }
      SERVICE_TYPE:          { type: string,    default: "backend" } # "backend" | "frontend"
      DEPLOY_TARGET:         { type: string,    default: "cloudrun" } # "cloudrun" | "vm"
      VM_NAME:               { type: string,    default: "" }
      VM_ZONE:               { type: string,    default: "" }
      APP_DIR:               { type: string,    default: "" }
      HEALTH_PORT:           { type: string,    default: "8080" }
      ENV_FILE:              { type: string,    default: ".env" }
      REGION:                { type: string,    default: "us-central1" }
      MIN_INSTANCES:         { type: string,    default: "1" }
      MAX_INSTANCES:         { type: string,    default: "5" }
      MEMORY:                { type: string,    default: "512Mi" }
      CPU:                   { type: string,    default: "1" }
      CONCURRENCY:           { type: string,    default: "80" }
      TIMEOUT:               { type: string,    default: "300s" }
      ALLOW_UNAUTHENTICATED: { type: boolean,   default: false }
      INGRESS:               { type: string,    default: "internal-and-cloud-load-balancing" }
      SECRETS_MAPPING:       { type: string,    default: "" }
      VPC_CONNECTOR:         { type: string,    default: "" }

    secrets:
      GCP_PROJECT_ID:             { required: true }
      WORKLOAD_IDENTITY_PROVIDER: { required: true }
      SERVICE_ACCOUNT:            { required: true }
      SERVICE_ENV:                { required: true }
      SLACK_WEBHOOK_URL:          { required: false }

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. BUILD & ARTIFACT REGISTRY PUSH
  # ══════════════════════════════════════════════════════════════
  build-and-push:
    name: 🔨 Build & Push Container
    runs-on: ubuntu-latest
    outputs:
      git_sha: ${{ steps.meta.outputs.git_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Git SHA
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "git_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP via Workload Identity (Keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication for GAR
        run: gcloud auth configure-docker ${{ inputs.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Image
        run: |
          set -e
          SHA="${{ steps.meta.outputs.git_sha }}"
          IMAGE="${{ inputs.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.AR_REPO }}/${{ inputs.SERVICE_NAME }}:${SHA}-${{ inputs.ENV_TAG }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "✅ Pushed: $IMAGE"

  # ══════════════════════════════════════════════════════════════
  # 2. VULNERABILITY SCAN (Trivy Security Gate)
  # ══════════════════════════════════════════════════════════════
  security-scan:
    name: 🔒 Trivy Container Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: inputs.ENV_TAG == 'prod' || inputs.ENV_TAG == 'staging'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan Filesystem & Dependencies with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Non-blocking informative audit gate
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF Security Report to GitHub CodeQL
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Export JSON Compliance Report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: "CRITICAL,HIGH"
          scanners: vuln
          exit-code: "0"
          format: json
          output: trivy-report.json

      - name: Upload Compliance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ inputs.SERVICE_NAME }}-${{ inputs.ENV_TAG }}
          path: trivy-report.json

  # ══════════════════════════════════════════════════════════════
  # 3. ZERO-TRUST DEPLOYMENT (Cloud Run or VM)
  # ══════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy (${{ inputs.DEPLOY_TARGET }})
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')

    steps:
      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # ── PATH A: CLOUD RUN (Private VPC Egress) ─────────────────
      - name: Parse Environment Secrets (Cloud Run)
        if: ${{ inputs.DEPLOY_TARGET == 'cloudrun' && inputs.SERVICE_TYPE == 'backend' }}
        run: |
          SKIP_KEYS="DATABASE_URL|JWT_SECRET_KEY|ADMIN_PASSWORD|API_KEY|PORT"
          echo "${{ secrets.SERVICE_ENV }}" \
            | grep -v '^#' | grep -v '^$' \
            | while IFS='=' read -r key value; do
                if echo "$key" | grep -qE "^($SKIP_KEYS)$"; then continue; fi
                safe=$(echo "$value" | sed 's/\\/\\\\/g; s/"/\\"/g')
                printf '%s: "%s"\n' "$key" "$safe"
              done > env.yaml

      - name: Deploy to Cloud Run
        if: ${{ inputs.DEPLOY_TARGET == 'cloudrun' }}
        run: |
          set -e
          SERVICE="${{ inputs.SERVICE_NAME }}-${{ inputs.ENV_TAG }}"
          SHA="${{ needs.build-and-push.outputs.git_sha }}"
          IMAGE="${{ inputs.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.AR_REPO }}/${{ inputs.SERVICE_NAME }}:${SHA}-${{ inputs.ENV_TAG }}"

          AUTH_FLAG="--no-allow-unauthenticated"
          [[ "${{ inputs.ALLOW_UNAUTHENTICATED }}" == "true" ]] && AUTH_FLAG="--allow-unauthenticated"

          SECRETS_FLAG=""
          [[ -n "${{ inputs.SECRETS_MAPPING }}" ]] && SECRETS_FLAG="--update-secrets=${{ inputs.SECRETS_MAPPING }}"

          VPC_FLAG=""
          [[ -n "${{ inputs.VPC_CONNECTOR }}" ]] && VPC_FLAG="--vpc-connector=projects/${{ secrets.GCP_PROJECT_ID }}/locations/${{ inputs.REGION }}/connectors/${{ inputs.VPC_CONNECTOR }} --vpc-egress=private-ranges-only"

          PORT_FLAG=""
          [[ "${{ inputs.SERVICE_TYPE }}" == "frontend" ]] && PORT_FLAG="--port=3000"

          ENV_FLAG=""
          [[ -f env.yaml ]] && ENV_FLAG="--env-vars-file=env.yaml"

          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="${{ inputs.REGION }}" \
            --platform=managed \
            $AUTH_FLAG \
            $ENV_FLAG \
            $SECRETS_FLAG \
            $VPC_FLAG \
            $PORT_FLAG \
            --memory="${{ inputs.MEMORY }}" \
            --cpu="${{ inputs.CPU }}" \
            --min-instances="${{ inputs.MIN_INSTANCES }}" \
            --max-instances="${{ inputs.MAX_INSTANCES }}" \
            --concurrency="${{ inputs.CONCURRENCY }}" \
            --timeout="${{ inputs.TIMEOUT }}" \
            --execution-environment=gen2 \
            --service-account="${{ secrets.SERVICE_ACCOUNT }}" \
            --ingress="${{ inputs.INGRESS }}"
          echo "✅ Successfully Deployed to Cloud Run: $SERVICE"

      # ── PATH B: PRIVATE VM DEPLOYMENT (IAP Tunneling) ─────────
      - name: Generate VM Deployment Script
        if: ${{ inputs.DEPLOY_TARGET == 'vm' }}
        run: |
          cat > /tmp/vm_deploy.sh << 'DEPLOY_EOF'
          #!/usr/bin/env bash
          set -e

          OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' "${COMPOSE_SERVICE}" 2>/dev/null || echo '')
          echo "Current Running Image: ${OLD_IMAGE}"
          echo "Deploying Target Image: ${NEW_IMAGE}"

          if [[ -f ~/secret_${COMPOSE_SERVICE}.b64 ]]; then
            mkdir -p "${APP_DIR}"
            base64 -d ~/secret_${COMPOSE_SERVICE}.b64 > "${APP_DIR}/${ENV_FILE}"
            chmod 600 "${APP_DIR}/${ENV_FILE}"
            rm -f ~/secret_${COMPOSE_SERVICE}.b64
          fi

          echo "Pulling container image..."
          docker pull "${NEW_IMAGE}"

          # Update image tag in docker-compose.yml while old container is running
          sed -i "s|image: .*/${BASE_SERVICE_NAME}:.*|image: ${NEW_IMAGE}|" "${APP_DIR}/docker-compose.yml"
          docker compose -f "${APP_DIR}/docker-compose.yml" up -d --no-deps "${COMPOSE_SERVICE}"

          # Health Probing with Fail-Fast Detection
          HEALTHY=false
          COUNT=0
          while [ $COUNT -lt 24 ]; do
            COUNT=$((COUNT + 1))
            STATUS=$(docker inspect --format='{{.State.Status}}' "${COMPOSE_SERVICE}" 2>/dev/null || echo 'missing')
            echo "Health Probe [${COUNT}/24] -> Status: ${STATUS}"
            if [[ "${STATUS}" == 'exited' || "${STATUS}" == 'dead' ]]; then
              echo "🚨 Container crashed immediately on startup — failing fast!"
              docker logs --tail=50 "${COMPOSE_SERVICE}" 2>/dev/null || true
              break
            fi
            if [[ "${STATUS}" == 'running' ]]; then
              if curl -sf --max-time 3 "http://localhost:${HEALTH_PORT}/health" > /dev/null 2>&1; then
                echo "✅ Health check passed on port :${HEALTH_PORT}"
                HEALTHY=true
                break
              fi
            fi
            sleep 5
          done

          # Automated Rollback on Unhealthy Deployment
          if [[ "${HEALTHY}" != 'true' ]]; then
            echo "🚨 Deployment unhealthy — triggering automated rollback..."
            docker logs --tail=80 "${COMPOSE_SERVICE}" > ~/deploy_fail_logs.txt 2>&1 || true
            docker compose -f "${APP_DIR}/docker-compose.yml" stop "${COMPOSE_SERVICE}" || true
            docker compose -f "${APP_DIR}/docker-compose.yml" rm -f "${COMPOSE_SERVICE}" || true
            if [[ -n "${OLD_IMAGE}" ]]; then
              sed -i "s|image: .*/${BASE_SERVICE_NAME}:.*|image: ${OLD_IMAGE}|" "${APP_DIR}/docker-compose.yml"
              docker compose -f "${APP_DIR}/docker-compose.yml" up -d --no-deps "${COMPOSE_SERVICE}"
              echo "✅ Restored previous working container: ${OLD_IMAGE}"
            fi
            exit 1
          fi

          echo "✅ Deployment verified healthy."
          DEPLOY_EOF
          chmod +x /tmp/vm_deploy.sh

      - name: Transfer & Execute via IAP Tunnel
        if: ${{ inputs.DEPLOY_TARGET == 'vm' }}
        run: |
          echo "Tunneling deployment files through GCP Identity-Aware Proxy..."
          gcloud compute scp /tmp/vm_deploy.sh "${{ inputs.VM_NAME }}:~/vm_deploy.sh" \
            --zone="${{ inputs.VM_ZONE }}" --tunnel-through-iap
          gcloud compute ssh "${{ inputs.VM_NAME }}" \
            --zone="${{ inputs.VM_ZONE }}" --tunnel-through-iap \
            --command="bash ~/vm_deploy.sh"

      # ── Slack Alerting ─────────────────────────────────────────
      - name: Slack Notification — Success
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const wh = process.env.SLACK_WEBHOOK_URL;
            if (!wh) return;
            await fetch(wh, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: `✅ *Deployment Succeeded:* ${{ inputs.SERVICE_NAME }}-${{ inputs.ENV_TAG }} deployed to ${{ inputs.DEPLOY_TARGET }}` })
            });

      - name: Slack Notification — Rollback Failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const wh = process.env.SLACK_WEBHOOK_URL;
            if (!wh) return;
            await fetch(wh, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: `🚨 *Deployment Failed & Auto-Rolled Back:* ${{ inputs.SERVICE_NAME }}-${{ inputs.ENV_TAG }}` })
            });
